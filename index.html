<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS ร้านไก่ทอด</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap">
<style>
:root{--bg:#FBFAF6;--card:#fff;--ink:#2A1B14;--mute:#7a6a60;--line:#e9e2d6;--gold:#E8A317;--chili:#C62828;--ok:#2E7D32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1410;--card:#2a1f19;--ink:#f6ece3;--mute:#b5a497;--line:#3d2e25;--gold:#F0B33A;--chili:#ef6a5e;--ok:#6fbf73}}
:root[data-theme="dark"]{--bg:#1c1410;--card:#2a1f19;--ink:#f6ece3;--mute:#b5a497;--line:#3d2e25;--gold:#F0B33A;--chili:#ef6a5e;--ok:#6fbf73}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Prompt,"Noto Sans Thai",system-ui,sans-serif;padding-bottom:150px}
header{padding:14px 16px 6px}
header h1{margin:0;font-size:22px;font-weight:700}
header p{margin:0;color:var(--mute);font-size:14px}
main{padding:8px 12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.p{position:relative}
.p>button:first-child{width:100%;min-height:104px;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:2px}
.p>button:first-child:active{border-color:var(--gold)}
.p .pr{font-size:20px;font-weight:700;color:var(--chili)}
.p small{color:var(--mute)}
.p.out>button:first-child{opacity:.45}
.p.in>button:first-child{border-color:var(--gold)}
.minus{position:absolute;top:8px;right:8px;border:0;border-radius:20px;background:var(--gold);color:#2A1B14;padding:4px 12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.step{display:flex;gap:6px;align-items:center}
.step button,.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;height:44px;padding:0 12px}
.step input,.f input{width:64px;height:44px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.f input{width:100%;text-align:left;padding:0 10px}
.f input.w{grid-column:1/-1}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#2A1B14;font-weight:700}
.btn.red{color:var(--chili)}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:0 8px;background:var(--chili);color:#fff;margin-left:6px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi .big{grid-column:1/-1;background:var(--ink);color:var(--bg);border:0}
.kpi b{font-size:26px;display:block}.kpi .big b{font-size:40px;color:var(--gold)}
.kpi span{font-size:14px;opacity:.8}
h2{font-size:17px;margin:18px 4px 8px}
.bar{height:10px;border-radius:5px;background:var(--gold);min-width:2px}
.bars .row{font-size:13px;margin:4px 0}.bars .d{width:72px;color:var(--mute)}.bars .v{width:70px;text-align:right}
.bars .row.sel .d{color:var(--ink);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
#cart{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:8px 12px;display:none}
#cart button{width:100%;height:56px;border:0;border-radius:16px;background:var(--chili);color:#fff;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;height:60px;border:0;background:none;color:var(--mute);font-weight:500}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
#sheet .box{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sheet .big{font-size:40px;font-weight:700;color:var(--chili)}
#sheet input{width:100%;height:52px;font:inherit;font-size:22px;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:10px 0}
.q{display:flex;gap:8px;flex-wrap:wrap}
#chg{font-size:18px;font-weight:700;margin-bottom:10px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9;font-weight:500}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}.seg button.on{background:var(--gold);border-color:var(--gold);color:#2A1B14;font-weight:700}
#sheet .box{max-height:92vh;overflow:auto}
.qr{background:#fff;padding:10px;border-radius:12px;width:220px;margin:8px auto}
.rc{font-size:14px;background:#fff;color:#222;padding:14px;border-radius:10px;margin:10px 0;line-height:1.5}.rc hr{border:0;border-top:1px dashed #999}
.mini{display:flex;gap:6px;margin-top:6px}.mini label{font-size:12px;color:var(--mute);flex:1;min-width:0}.mini input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;padding:0 6px}
.fl{display:block;margin-bottom:10px;font-size:14px;color:var(--mute)}.fl input:not([type=checkbox]){width:100%;height:44px;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:0 10px}
@media print{body>*:not(#sheet){display:none!important}#sheet{position:static;background:none;display:block!important}#sheet .box{background:none;padding:0}#sheet .box>.row button,#sheet .big{display:none}}
.im{width:100%;height:76px;object-fit:cover;border-radius:10px;margin-bottom:4px;display:block}
.thumb{width:64px;height:64px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;overflow:hidden;cursor:pointer;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}
.nm{width:100%;height:40px;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 8px;margin-bottom:2px}
.ei{width:130px;height:44px;text-align:right;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:0 10px}
.stl{font-size:13px;color:var(--mute);text-align:center;margin-bottom:3px}
</style></head>
<body>
<header><h1>🍗 ร้านไก่ทอด</h1><p id="today"></p></header>
<main id="app"></main>
<div id="cart"><button data-a="open"><span id="cn"></span><span id="ct"></span></button></div>
<nav>
<button class="tab" data-a="tab" data-id="sell">ขาย</button>
<button class="tab" data-a="tab" data-id="stock">สต็อก</button>
<button class="tab" data-a="tab" data-id="sum">รายงาน</button>
<button class="tab" data-a="tab" data-id="set">ตั้งค่า</button>
</nav>
<div id="sheet"></div><div id="toast"></div>
<script>
const K='friedchicken_pos_v1',LOW=10;
const DEF={products:[
{id:'p1',name:'ไก่ทอดน่อง',price:30,stock:40},{id:'p2',name:'ไก่ทอดอก',price:35,stock:30},
{id:'p3',name:'ไก่ทอดปีก',price:25,stock:40},{id:'p4',name:'ไก่ทอดสะโพก',price:35,stock:30},
{id:'p5',name:'เฟรนช์ฟรายส์',price:30,stock:50},{id:'p6',name:'ข้าวเหนียว',price:10,stock:60},
{id:'p7',name:'น้ำเปล่า',price:10,stock:48},{id:'p8',name:'น้ำอัดลม',price:20,stock:36}],sales:[]};
let S;try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
if(!S||!S.products)S=JSON.parse(JSON.stringify(DEF));
function migrate(){S.set=Object.assign({name:'ร้านไก่ทอด',addr:'',tax:'',vat:false,pp:'',n:0},S.set||{});S.products.forEach(p=>{if(p.cost==null)p.cost=Math.round(p.price*.45);if(p.bc==null)p.bc=''})}migrate();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),P=id=>S.products.find(p=>p.id===id);
const fmt=n=>Number(n).toLocaleString('th-TH'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let tab='sell',cart={},day=dk(Date.now()),pend='';
$('#today').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+q*P(id).price,0);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}

function vSell(){return '<div class="row" style="margin-bottom:10px"><input id="bc" class="fl" style="flex:1;height:48px;margin:0;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:0 12px" placeholder="สแกนหรือพิมพ์บาร์โค้ด แล้วกด Enter" inputmode="numeric"><button class="btn" style="height:48px" data-a="cam">กล้อง</button></div><div class="grid">'+S.products.map(p=>{const q=cart[p.id]||0,left=p.stock-q;
return `<div class="p ${left<=0?'out':''} ${q?'in':''}"><button data-a="add" data-id="${p.id}" ${left<=0?'disabled':''}>${p.img?`<img class="im" src="${p.img}" alt="">`:''}<b>${esc(p.name)}</b><span class="pr">฿${fmt(p.price)}</span><small>${left<=0?'หมด':'เหลือ '+left}</small></button>${q?`<button class="minus" data-a="sub" data-id="${p.id}">− ${q}</button>`:''}</div>`}).join('')+'</div>'+(S.products.length?'':'<p class="empty">ยังไม่มีสินค้า ไปเพิ่มที่แท็บสต็อก</p>')}

function vStock(){const low=S.products.filter(p=>p.stock<=LOW).length;
return `<div class="card"><b>เพิ่มสินค้าใหม่</b><div class="f" style="margin-top:8px"><input class="w" id="nn" placeholder="ชื่อสินค้า"><input id="np" type="number" inputmode="numeric" placeholder="ราคาขาย"><input id="nc" type="number" inputmode="numeric" placeholder="ต้นทุน"><input id="ns" type="number" inputmode="numeric" placeholder="จำนวน"><input class="w" id="nb" placeholder="บาร์โค้ด (ไม่บังคับ)"><button class="btn pri" style="grid-column:1/-1" data-a="addp">เพิ่มสินค้า</button></div></div>`+
(low?`<p style="margin:4px 4px 10px;color:var(--chili);font-weight:500">ใกล้หมด ${low} รายการ</p>`:'')+
S.products.map(p=>`<div class="card row" style="flex-wrap:wrap"><label class="thumb">${p.img?`<img src="${p.img}" alt="">`:'+ รูป'}<input type="file" accept="image/*" data-f="img" data-id="${p.id}" hidden></label><div class="grow" style="flex:1"><input class="nm" value="${esc(p.name)}" data-f="name" data-id="${p.id}" aria-label="ชื่อเมนู">${p.stock<=LOW?'<span class="tag">'+(p.stock?'ใกล้หมด':'หมด')+'</span>':''}<div class="mini"><label>ขาย<input type="number" inputmode="numeric" value="${p.price}" data-f="price" data-id="${p.id}"></label><label>ทุน<input type="number" inputmode="numeric" value="${p.cost}" data-f="cost" data-id="${p.id}"></label><label>บาร์โค้ด<input value="${esc(p.bc)}" data-f="bc" data-id="${p.id}"></label></div></div><div><div class="stl">สต็อกคงเหลือ</div><div class="step"><button data-a="dec" data-id="${p.id}">−</button><input type="number" inputmode="numeric" min="0" value="${p.stock}" data-f="stock" data-id="${p.id}" aria-label="จำนวนคงเหลือ"><button data-a="inc" data-id="${p.id}">+</button><button data-a="inc10" data-id="${p.id}">+10</button></div></div></div><div style="text-align:right;margin:-4px 0 10px">${p.img?`<button class="btn" data-a="rmimg" data-id="${p.id}">ลบรูป</button> `:''}<button class="btn red" data-a="del" data-id="${p.id}">${pend==='d'+p.id?'แตะอีกครั้งเพื่อลบ':'ลบสินค้า'}</button></div>`).join('')}

function vSum(){const ss=S.sales.filter(s=>dk(s.t)===day).sort((a,b)=>b.t-a.t),sum=ss.reduce((a,s)=>a+s.total,0);
const it={};ss.forEach(s=>s.items.forEach(i=>{it[i.name]=it[i.name]||{q:0,v:0};it[i.name].q+=i.qty;it[i.name].v+=i.qty*i.price}));
const list=Object.entries(it).sort((a,b)=>b[1].q-a[1].q);
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=dk(d);return{k,l:d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric'}),v:S.sales.filter(s=>dk(s.t)===k).reduce((a,s)=>a+s.total,0)}});
const mx=Math.max(1,...days.map(d=>d.v)),low=S.products.filter(p=>p.stock<=LOW);
return `<div class="row" style="margin:4px 4px 12px"><label for="dd" style="color:var(--mute)">วันที่</label><input id="dd" type="date" value="${day}" data-f="day" style="height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:0 10px"></div>
<div class="kpi"><div class="card big"><span>ยอดขายรวม</span><b>฿${fmt(sum)}</b></div><div class="card"><b>${ss.length}</b><span>บิล</span></div><div class="card"><b>฿${fmt(ss.length?Math.round(sum/ss.length):0)}</b><span>เฉลี่ยต่อบิล</span></div></div>
<h2>สินค้าที่ขายได้</h2><div class="card">${list.length?list.map(([n,v])=>`<div class="row" style="padding:4px 0"><span class="grow">${esc(n)}</span><span>${v.q} ชิ้น</span><b style="width:80px;text-align:right">฿${fmt(v.v)}</b></div>`).join(''):'<p class="empty">วันนี้ยังไม่มียอดขาย</p>'}</div>
<h2>7 วันล่าสุด</h2><div class="card bars">${days.map(d=>`<div class="row ${d.k===day?'sel':''}"><span class="d">${d.l}</span><div class="grow"><div class="bar" style="width:${d.v/mx*100}%"></div></div><span class="v">฿${fmt(d.v)}</span></div>`).join('')}</div>
${low.length?`<h2>ต้องเติมสต็อก</h2><div class="card">${low.map(p=>`<div class="row" style="padding:4px 0"><span class="grow">${esc(p.name)}</span><b style="color:var(--chili)">${p.stock?'เหลือ '+p.stock:'หมด'}</b></div>`).join('')}</div>`:''}
<h2>รายการบิล</h2>${ss.length?ss.map(s=>`<div class="card"><div class="row"><b class="grow">${new Date(s.t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} น.</b><b>฿${fmt(s.total)}</b></div><div style="color:var(--mute);font-size:14px">${s.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div><div style="text-align:right"><button class="btn red" data-a="void" data-id="${s.id}">${pend==='v'+s.id?'แตะอีกครั้งเพื่อยกเลิกบิล':'ยกเลิกบิล'}</button></div></div>`).join(''):'<p class="empty">ไม่มีบิลในวันนี้</p>'}`}

function renderCart(){const n=count();$('#cart').style.display=tab==='sell'&&n?'block':'none';$('#cn').textContent='ตะกร้า '+n+' ชิ้น';$('#ct').textContent='รับเงิน ฿'+fmt(total())}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.id===tab));$('#app').innerHTML=tab==='sell'?vSell():tab==='stock'?vStock():vSum();renderCart()}

function openSheet(){const t=total();if(!t)return;const sh=$('#sheet');
sh.innerHTML=`<div class="box"><div class="row"><b class="grow">ยอดที่ต้องรับ</b><button class="btn" data-a="close">ปิด</button></div><div class="big">฿${fmt(t)}</div><input id="cash" type="number" inputmode="numeric" placeholder="เงินที่รับ" aria-label="เงินที่รับ"><div class="q"><button class="btn" data-a="cash" data-v="${t}">พอดี</button>${[100,500,1000].filter(v=>v>=t).map(v=>`<button class="btn" data-a="cash" data-v="${v}">${fmt(v)}</button>`).join('')}</div><div id="chg" style="margin-top:12px"></div><button class="btn pri" id="payb" data-a="pay" style="width:100%;height:56px;font-size:18px">บันทึกการขาย</button></div>`;
sh.style.display='flex';chg()}
function chg(){const v=+$('#cash').value||0,t=total();$('#chg').textContent=v>=t&&v>0?'เงินทอน ฿'+fmt(v-t):'ยังขาด ฿'+fmt(Math.max(0,t-v));$('#payb').disabled=v<t;$('#payb').style.opacity=v<t?.4:1}
function pay(){const t=total(),cash=+$('#cash').value||0;if(cash<t)return;
const items=Object.entries(cart).map(([id,q])=>{const p=P(id);p.stock=Math.max(0,p.stock-q);return{id,name:p.name,price:p.price,qty:q}});
S.sales.push({id:'s'+Date.now(),t:Date.now(),items,total:t,cash});save();
$('#sheet').style.display='none';cart={};day=dk(Date.now());toast('บันทึกแล้ว ทอน ฿'+fmt(cash-t));render()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,p=id&&P(id);
if(a!=='del'&&a!=='void')pend='';
if(a==='tab'){tab=id;render()}
else if(a==='add'){if((cart[id]||0)<p.stock){cart[id]=(cart[id]||0)+1;render()}}
else if(a==='sub'){cart[id]--;if(!cart[id])delete cart[id];render()}
else if(a==='open')openSheet();
else if(a==='close')$('#sheet').style.display='none';
else if(a==='cash'){$('#cash').value=b.dataset.v;chg()}
else if(a==='pay')pay();
else if(a==='inc'||a==='inc10'||a==='dec'){p.stock=Math.max(0,p.stock+(a==='inc'?1:a==='inc10'?10:-1));save();render()}
else if(a==='addp'){const n=$('#nn').value.trim(),pr=+$('#np').value,st=parseInt($('#ns').value)||0;if(!n||!(pr>=0)||$('#np').value===''){toast('กรอกชื่อและราคาก่อน');return}S.products.push({id:'p'+Date.now(),name:n,price:pr,cost:+$('#nc').value||0,bc:$('#nb').value.trim(),stock:st});save();render()}
else if(a==='del'){if(pend==='d'+id){S.products=S.products.filter(x=>x.id!==id);delete cart[id];pend='';save()}else pend='d'+id;render()}
else if(a==='void'){if(pend==='v'+id){const s=S.sales.find(x=>x.id===id);s.items.forEach(i=>{const q=P(i.id);if(q)q.stock+=i.qty});S.sales=S.sales.filter(x=>x.id!==id);pend='';save();toast('ยกเลิกบิลและคืนสต็อกแล้ว')}else pend='v'+id;render()}});
document.addEventListener('input',e=>{if(e.target.id==='cash')chg()});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f,pp=t.dataset.id&&P(t.dataset.id);if(f==='stock'){pp.stock=Math.max(0,parseInt(t.value)||0);save();render()}else if(f==='price'||f==='cost'){pp[f]=Math.max(0,+t.value||0);save();render()}else if(f==='bc'){pp.bc=t.value.trim();save()}else if(f==='set'){S.set[t.dataset.k]=t.type==='checkbox'?t.checked:t.value.trim();save();render()}
else if(t.dataset.f==='day'&&t.value){day=t.value;render()}});
/* ---- v2: barcode, payments, receipt, reports, settings ---- */
let pm='cash',per='day',rcp=null,camOn=false,refocus=false,rst=false;

function mkDB(sb){const cache={},ls=[];let ch=null;

async function load(c){let all=[],from=0;for(;;){const{data,error}=await sb.from('kv').select('id,data').eq('collection',c).range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}const m=new Map();all.forEach(r=>m.set(r.id,r.data));cache[c]=m;emit(c)}
function chan(){if(ch)return;ch=sb.channel('kv').on('postgres_changes',{event:'*',schema:'public',table:'kv'},p=>{const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.collection)return;if(p.eventType==='DELETE')rows(r.collection).delete(r.id);else rows(r.collection).set(r.id,r.data);emit(r.collection)}).subscribe(st=>{if(st==='SUBSCRIBED')Object.keys(cache).forEach(c=>load(c).catch(()=>{}))});
setInterval(()=>{if(document.visibilityState==='visible')Object.keys(cache).forEach(c=>load(c).catch(()=>{}))},45000)}
function sub(c,fire,err){const l={c,fire};ls.push(l);chan();if(cache[c])fire();else load(c).catch(e=>err&&err({code:e.code||'error'}));return()=>{const i=ls.indexOf(l);if(i>=0)ls.splice(i,1)}}
const dsnap=(id,d)=>({id,exists:d!==undefined,data:()=>d,metadata:{}});
const qsnap=c=>{const docs=[...rows(c)].map(([id,d])=>dsnap(id,d));return{docs,size:docs.length,empty:!docs.length}};
const ref=(c,id)=>({id,path:c+'/'+id,
async get(){const{data,error}=await sb.from('kv').select('data').eq('collection',c).eq('id',id).maybeSingle();if(error)throw error;return dsnap(id,data?data.data:undefined)},
async set(d){const{error}=await sb.from('kv').upsert({collection:c,id,data:d});if(error)throw error;rows(c).set(id,d);emit(c)},
async update(o){const cur=(await this.get()).data()||{};await this.set({...cur,...o})},
async delete(){const{error}=await sb.from('kv').delete().eq('collection',c).eq('id',id);if(error)throw error;rows(c).delete(id);emit(c)},
onSnapshot(next,err){return sub(c,()=>next(dsnap(id,rows(c).get(id))),err)}});
const col=c=>({path:c,doc:id=>ref(c,id||'x'+Math.random().toString(36).slice(2,10)),
async get(){if(!cache[c])await load(c);return qsnap(c)},
onSnapshot(next,err){return sub(c,()=>next(qsnap(c)),err)}});
return{collection:col,doc:p=>{const[c,id]=p.split('/');return ref(c,id)}}}

d.innerHTML='<div class="card" style="width:100%;max-width:360px"><h2 style="margin-top:0">\u0e40\u0e02\u0e49\u0e32\u0e2a\u0e39\u0e48\u0e23\u0e30\u0e1a\u0e1a POS</h2><label class="fl">\u0e2d\u0e35\u0e40\u0e21\u0e25<input id="em" type="email" autocomplete="username"></label><label class="fl">\u0e23\u0e2b\u0e31\u0e2a\u0e1c\u0e48\u0e32\u0e19<input id="pw" type="password" autocomplete="current-password"></label><p id="le" style="color:var(--chili);min-height:1.4em"></p><button class="btn pri" id="lb" style="width:100%;height:50px">\u0e40\u0e02\u0e49\u0e32\u0e2a\u0e39\u0e48\u0e23\u0e30\u0e1a\u0e1a</button></div>';
document.body.appendChild(d);
const go=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error){$('#le').textContent='\u0e2d\u0e35\u0e40\u0e21\u0e25\u0e2b\u0e23\u0e37\u0e2d\u0e23\u0e2b\u0e31\u0e2a\u0e1c\u0e48\u0e32\u0e19\u0e44\u0e21\u0e48\u0e16\u0e39\u0e01\u0e15\u0e49\u0e2d\u0e07';return}d.remove();onOk()};
$('#lb').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
async function start(sb){DB=mkDB(sb);ro=false;try{const r=await sb.rpc('my_role');ro=r.data==='viewer';cashier=r.data==='cashier'}catch(e){}if(ro){tab='sum';const t0=document.querySelector('.tab[data-id="sell"]');if(t0)t0.style.display='none'}
const er=x=>{setSt('\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e21\u0e15\u0e48\u0e2d\u0e02\u0e31\u0e14\u0e02\u0e49\u0e2d\u0e07 ('+(x&&x.code||'error')+')')};
DB.collection('products').onSnapshot(s=>{prods={};s.docs.forEach(d=>prods[d.id]=d.data());refresh()},er);
DB.collection('ledger').onSnapshot(s=>{led={};s.docs.forEach(d=>led[d.id]=d.data());if(!ready){ready=true;setSt(ro?'ดูข้อมูลอย่างเดียว':(cashier?'พนักงานขาย · ':'')+'ซิงก์แล้ว · เครื่อง '+dev)}refresh()},er);
DB.doc('config/main').onSnapshot(s=>{cfg=s.data()||{};refresh()},er);DB.collection('expenses').onSnapshot(s=>{exps={};s.docs.forEach(d=>exps[d.id]=d.data());refresh()},er);
const h=document.querySelector('header'),lo=document.createElement('button');lo.textContent='\u0e2d\u0e2d\u0e01\u0e08\u0e32\u0e01\u0e23\u0e30\u0e1a\u0e1a';lo.className='btn';lo.style.cssText='position:absolute;top:12px;right:12px;height:36px;min-width:0;font-size:13px';lo.onclick=async()=>{await sb.auth.signOut();location.reload()};h.style.position='relative';h.appendChild(lo)}

const sb=supabase.createClient(SB_URL,SB_KEY),{data}=await sb.auth.getSession();if(data.session)start(sb);else loginUI(sb,()=>start(sb))})();
/* ---- product photos ---- */
function shrink(file,max){max=max||360;return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>rej(new Error('img'));im.src=u})}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f!=='img')return;e.stopImmediatePropagation();const f=t.files[0];if(!f||!ok())return;
shrink(f).then(d=>DB.collection('products').doc(t.dataset.id).update({img:d})).then(()=>toast('\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e23\u0e39\u0e1b\u0e41\u0e25\u0e49\u0e27')).catch(()=>toast('\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e23\u0e39\u0e1b\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08'))},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="rmimg"]');if(!b)return;e.stopImmediatePropagation();if(!ok())return;
DB.collection('products').doc(b.dataset.id).update({img:''}).catch(()=>toast('\u0e25\u0e1a\u0e23\u0e39\u0e1b\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08'))},true);
/* ---- editable names + daily expenses ---- */
var exps={};
const EXP=[['mk','ค่าการตลาด'],['rent','ค่าเช่าที่'],['water','ค่าน้ำ'],['elec','ค่าไฟ'],['wage','ค่าจ้างพนักงาน'],['supply','ค่าสิ้นเปลือง']];
function effExp(d){const k=Object.keys(exps).filter(x=>x<=d).sort().pop();return k?{src:k,v:exps[k]}:null}
function hintExp(){const e=effExp(day);return !e?'กรอกแล้วระบบบันทึกอัตโนมัติ และใช้ค่านี้ต่อทุกวันจนกว่าจะแก้ไข':e.src===day?'บันทึกอัตโนมัติ ค่านี้จะใช้ต่อในวันถัดไปจนกว่าจะแก้ไข':'ใช้ค่าต่อจากวันที่ '+new Date(e.src+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' แก้ช่องใดก็ได้เพื่อบันทึกค่าใหม่ตั้งแต่วันนี้เป็นต้นไป'}
function expSum(a,b,rev){const by={};let tot=0,end=new Date();end.setHours(24,0,0,0);end=Math.min(b,end.getTime());
for(const d=new Date(a);d.getTime()<end;d.setDate(d.getDate()+1)){const e=effExp(dk(d));if(e)EXP.forEach(([c])=>{if(c==='mk')return;const x=+e.v[c]||0;by[c]=(by[c]||0)+x;tot+=x})}by.mk=Math.round((rev||0)*1.5)/100;tot=Math.round((tot+by.mk)*100)/100;return{by,tot}}
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(f!=='name'&&f!=='exp')return;e.stopImmediatePropagation();if(!ok()){render();return}
if(f==='name'){const v=t.value.trim();if(!v){render();return}DB.collection('products').doc(t.dataset.id).update({name:v}).then(()=>toast('บันทึกชื่อแล้ว')).catch(()=>toast('บันทึกไม่สำเร็จ'))}
else{const e=effExp(day),cur={};EXP.forEach(([c])=>{if(c!=='mk')cur[c]=e?(+e.v[c]||0):0});cur[t.dataset.k]=Math.max(0,+t.value||0);DB.collection('expenses').doc(day).set(cur).then(()=>toast('บันทึกค่าใช้จ่ายแล้ว')).catch(()=>toast('บันทึกไม่สำเร็จ'))}},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="expcopy"]');if(!b)return;e.stopImmediatePropagation();if(!ok())return;
const prev=Object.keys(exps).filter(k=>k<day).sort().pop();if(!prev){toast('ยังไม่มีข้อมูลวันก่อนหน้า');return}
DB.collection('expenses').doc(day).set({...exps[prev]}).then(()=>toast('คัดลอกจากวันที่ '+prev)).catch(()=>toast('บันทึกไม่สำเร็จ'))},true);
